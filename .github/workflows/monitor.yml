name: Vigilar Web Noticias publicado

on:
  workflow_run:
    workflows: ["Actualizar Noticias del Momento"]
    types: [completed]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: web-noticias-public-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluar publicación real
        id: evaluate
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
        run: |
          python3 scripts/check_news_site.py > health-report.txt 2>&1
      - name: Gestionar incidencia única y cierre por recuperación
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_RESULT: ${{ steps.evaluate.outcome }}
        shell: bash
        run: |
          cat health-report.txt
          cat health-report.txt >> "$GITHUB_STEP_SUMMARY"
          issue_title='Web Noticias: alerta automática de publicación'
          open_issue=$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Web Noticias: alerta automática de publicación") | .number' | head -n 1)
          if [ "$CHECK_RESULT" != 'success' ]; then
            if [ -z "$open_issue" ]; then
              gh issue create --repo "$GH_REPO" --title "$issue_title" --body-file health-report.txt
            else
              gh issue edit "$open_issue" --repo "$GH_REPO" --body-file health-report.txt
            fi
            exit 1
          fi
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$GH_REPO" --body 'Recuperación comprobada en la URL pública: portada, fecha y sitemap válidos.'
            gh issue close "$open_issue" --repo "$GH_REPO" --reason completed
          fi
