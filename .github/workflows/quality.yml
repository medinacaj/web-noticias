name: Integridad del historial
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-quality
  cancel-in-progress: false
jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check gnews-decoder==0.1.1
      - run: python3 -c "from gnews_decoder import decode_many; assert callable(decode_many)"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_history.py
  normalize-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check gnews-decoder==0.1.1
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_history.py
