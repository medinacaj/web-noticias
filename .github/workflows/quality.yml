name: Integridad del historial
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['data/historial.json', 'scripts/**', 'tests/**', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-quality
  cancel-in-progress: false
jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_history.py
  normalize-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/dedupe_history.py
      - run: python3 scripts/validate_history.py
      - name: Registrar deduplicación solo si hay cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historial.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: deduplicar historial validado [skip ci]'
            git push origin HEAD:main
          fi
