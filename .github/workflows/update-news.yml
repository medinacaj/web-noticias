name: Actualizar Noticias del Momento

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, minuto 7 (evita la congestión del minuto 0)
  workflow_dispatch: {}    # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]
    paths:
      - "template.html"
      - "fetch_noticias.py"
      - "static/**"
      - ".github/workflows/update-news.yml"
      - "scripts/**"
      - "eventos/agenda_manual.json"

# Permiso por defecto: ninguna etapa que procese fuentes externas puede escribir.
permissions:
  contents: read

concurrency:
  group: noticias-del-momento
  cancel-in-progress: false

jobs:
  generar:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Mantiene el entorno original, donde puede residir el secreto GNEWS_API_KEY.
    environment:
      name: github-pages
    steps:
      - name: Clonar código revisado de main sin credenciales de escritura
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Clonar sólo datos de news-data (lectura)
        uses: actions/checkout@v4
        with:
          ref: news-data
          path: .news-data
          sparse-checkout: data/historial.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Clonar sólo snapshots de eventos (events-data)
        uses: actions/checkout@v4
        with:
          ref: events-data
          path: .events-data
          sparse-checkout: |
            eventos/crawled_events.json
            eventos/national_events.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar decodificador de enlaces Google Noticias
        run: python3 -m pip install --disable-pip-version-check gnews-decoder==0.1.1

      - name: Cargar historial sin ejecutar archivos de la rama de datos
        run: |
          python3 scripts/news_data.py load --data-repo .news-data --history data/historial.json --state "$RUNNER_TEMP/news-data-state.json"
          python3 scripts/validate_history.py

      - name: Recolectar noticias y generar el sitio
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          ADSENSE_READY: ${{ vars.ADSENSE_READY }}
          ADSENSE_PRIVACY_URL: ${{ vars.ADSENSE_PRIVACY_URL }}
          ADSENSE_ROOT_CONTROLLED: ${{ vars.ADSENSE_ROOT_CONTROLLED }}
          NEWSLETTER_READY: ${{ vars.NEWSLETTER_READY }}
          NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER }}
          NEWSLETTER_SUBSCRIBE_URL: ${{ vars.NEWSLETTER_SUBSCRIBE_URL }}
          NEWSLETTER_PRIVACY_URL: ${{ vars.NEWSLETTER_PRIVACY_URL }}
          NEWSLETTER_UNSUBSCRIBE_URL: ${{ vars.NEWSLETTER_UNSUBSCRIBE_URL }}
        run: python3 fetch_noticias.py

      - name: Verificar contenido y calidad antes de publicar
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_history.py
          python3 scripts/audit_editorial_quality.py --strict
          python3 scripts/audit_seo.py --site public
          python3 scripts/audit_news_health.py

      - name: Preparar historial validado para el publicador
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-news-state
          cp -- data/historial.json build-news-state/historial.json
          cp -- "$RUNNER_TEMP/news-data-state.json" build-news-state/state.json

      - name: Transferir exclusivamente el historial y la referencia del commit
        uses: actions/upload-artifact@v4
        with:
          name: news-history-data
          path: build-news-state/
          retention-days: 1
          if-no-files-found: error

      - name: Preparar artefacto GitHub Pages sin permisos de despliegue
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  guardar_historial:
    needs: generar
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clonar código revisado sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Clonar solo historial (único checkout con credenciales de escritura)
        uses: actions/checkout@v4
        with:
          ref: news-data
          path: .news-data
          sparse-checkout: data/historial.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el historial generado
        uses: actions/download-artifact@v4
        with:
          name: news-history-data
          path: build-news-state

      - name: Revalidar el contenido antes de escribir
        shell: bash
        run: |
          set -euo pipefail
          cp -- build-news-state/historial.json data/historial.json
          python3 scripts/validate_history.py

      - name: Persistir solo el historial de la rama news-data
        run: python3 scripts/news_data.py persist --data-repo .news-data --history data/historial.json --state build-news-state/state.json

  publicar_pages:
    needs: [generar, guardar_historial]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar sitio generado y validado
        id: deployment
        uses: actions/deploy-pages@v4
