name: Actualizar Noticias del Momento

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, minuto 7 (evita la congestión del minuto 0)
  workflow_dispatch: {}    # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]
    paths:
      - "template.html"
      - "fetch_noticias.py"
      - "static/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: noticias-del-momento
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar decodificador de enlaces Google Noticias
        run: python3 -m pip install --disable-pip-version-check gnews-decoder==0.1.1

      - name: Recolectar noticias y generar el sitio
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          NEWSLETTER_READY: ${{ vars.NEWSLETTER_READY }}
          NEWSLETTER_SUBSCRIBE_URL: ${{ vars.NEWSLETTER_SUBSCRIBE_URL }}
          NEWSLETTER_PRIVACY_URL: ${{ vars.NEWSLETTER_PRIVACY_URL }}
          NEWSLETTER_UNSUBSCRIBE_URL: ${{ vars.NEWSLETTER_UNSUBSCRIBE_URL }}
        run: python3 fetch_noticias.py

      - name: Verificar contenido y calidad antes de publicar
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_history.py
          python3 scripts/audit_editorial_quality.py --strict
          python3 scripts/audit_seo.py --site public
          python3 scripts/audit_news_health.py

      - name: Guardar historial de noticias
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/historial.json
          if git diff --cached --quiet; then
            echo "Historial sin cambios"
          else
            git commit -m "Historial de noticias actualizado"
            git pull --rebase --autostash
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
